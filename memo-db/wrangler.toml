name = "cielis-memo-db"
main = "src/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "cielis-memo-db"
database_id = "REPLACE_WITH_ID_FROM_wrangler_d1_create"

# Workers AI(無料枠)
[ai]
binding = "AI"

[vars]
AI_MODEL = "@cf/meta/llama-3.3-70b-instruct-fp8-fast"
