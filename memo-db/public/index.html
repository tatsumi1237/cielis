<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>メモDB</title>
<link rel="manifest" href="/manifest.json">
<style>
 :root{color-scheme:light dark;--b:#ccc}
 body{font-family:-apple-system,system-ui,sans-serif;margin:0 auto;max-width:640px;padding:16px;line-height:1.6}
 textarea{width:100%;box-sizing:border-box;height:9em;font-size:16px;padding:10px;border:1px solid var(--b);border-radius:8px}
 .row{display:flex;gap:8px;margin:8px 0}
 button{flex:1;font-size:16px;padding:12px;border-radius:8px;border:1px solid var(--b);background:transparent;color:inherit}
 button.p{background:#111;color:#fff}
 #out{white-space:pre-wrap;border:1px solid var(--b);border-radius:8px;padding:12px;min-height:1.5em}
 #out:empty{display:none}
 .n{border-top:1px solid var(--b);padding:8px 0;font-size:14px}
 .n small{opacity:.6}
 .n a{float:right;color:#c00;font-size:12px}
 h2{font-size:15px;margin:20px 0 4px}
</style>
</head>
<body>
<textarea id="t" placeholder="メモを書く / 質問を書く&#10;例: 10月4日に年金事務所で社保登録、従業員の月額報酬を98,522円にした&#10;例: 去年登録した従業員の月額報酬は?"></textarea>
<div class="row">
 <button class="p" id="save">📝 保存</button>
 <button id="ask">🔍 質問</button>
</div>
<div id="out"></div>
<h2>最近のメモ</h2>
<div id="list"></div>
<script>
const $=id=>document.getElementById(id);
let token=localStorage.getItem('tok')||'';
async function api(path,opt={}){
  if(!token){token=prompt('アクセストークン')||'';localStorage.setItem('tok',token);}
  const r=await fetch('/api'+path,{...opt,headers:{authorization:'Bearer '+token,'content-type':'application/json'}});
  if(r.status===401){localStorage.removeItem('tok');token='';throw new Error('トークンが違います');}
  const d=await r.json();if(!r.ok)throw new Error(d.error||r.status);return d;
}
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
async function load(){
  try{const l=await api('/notes');
  $('list').innerHTML=l.map(n=>`<div class="n"><a href="#" data-id="${n.id}">削除</a><small>${n.event_date||n.created_at.slice(0,10)}</small> ${esc(n.title||'')}<br>${esc(n.raw)}</div>`).join('');}
  catch(e){$('out').textContent=e.message;}
}
$('list').onclick=async e=>{const id=e.target.dataset.id;if(id&&confirm('削除しますか?')){e.preventDefault();await api('/notes/'+id,{method:'DELETE'});load();}};
async function run(btn,fn){
  const t=$('t').value.trim();if(!t)return;
  btn.disabled=true;$('out').textContent='処理中…';
  try{await fn(t);}catch(e){$('out').textContent='エラー: '+e.message;}
  btn.disabled=false;
}
$('save').onclick=()=>run($('save'),async t=>{
  const d=await api('/note',{method:'POST',body:JSON.stringify({text:t})});
  $('out').textContent=`保存しました (#${d.id})\n${d.title||'(整理は失敗しましたが原文は保存済み)'}\n出来事の日付: ${d.event_date||'不明'}`;
  $('t').value='';load();
});
$('ask').onclick=()=>run($('ask'),async q=>{
  const d=await api('/ask',{method:'POST',body:JSON.stringify({question:q})});
  $('out').textContent=d.answer;
});
load();
</script>
</body>
</html>
