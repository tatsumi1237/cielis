<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>CIELIS SNSマネタイズ事業 ご紹介資料</title>
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="合同会社CIELIS SNSマネタイズ事業のご紹介資料（全10ページ）">
<meta property="og:title" content="CIELIS SNSマネタイズ事業 ご紹介資料">
<meta property="og:description" content="あなたのSNSを、収益を生み続ける資産へ。全10ページ">
<meta property="og:image" content="https://tatsumi1237.github.io/cielis/deck/s01.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@700;900&family=Outfit:wght@800;900&display=swap" rel="stylesheet">
<style>
/* Layout: slim sticky bar (name + PDF button), then the 10 slides stacked full-width with page counters */
:root{--cream:#fffaf2;--ink:#1b1b1f;--yellow:#ffd23f;--coral:#ff5a5f;--muted:#5f5a52;color-scheme:light}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--cream);color:var(--ink);font-family:"Noto Sans JP","Hiragino Sans","Yu Gothic",system-ui,sans-serif;line-height:1.6;padding-bottom:env(safe-area-inset-bottom,0px)}
.bar{position:sticky;top:0;z-index:5;background:rgba(255,250,242,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:2px solid var(--ink);padding-top:env(safe-area-inset-top,0px)}
.bar div{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.name{min-width:0}
.name b{display:block;font:900 18px "Outfit",sans-serif;letter-spacing:.2em}
.name span{display:block;font-size:12px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pdf{flex:none;display:inline-flex;align-items:center;gap:6px;background:var(--coral);color:#fff;text-decoration:none;font-weight:900;font-size:14px;border:2px solid var(--ink);border-radius:999px;padding:9px 16px;box-shadow:3px 3px 0 var(--ink)}
.pdf:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.pdf:focus-visible{outline:3px solid #3a86ff;outline-offset:3px}
.pdf svg{width:16px;height:16px}
main{max-width:1000px;margin:0 auto;padding:16px 12px 40px;display:grid;gap:14px}
figure{position:relative}
figure img{display:block;width:100%;height:auto;aspect-ratio:16/9;background:#eee;border:2px solid var(--ink);border-radius:12px}
figcaption{position:absolute;right:8px;top:8px;background:rgba(27,27,31,.8);color:#fff;font:800 12px "Outfit",sans-serif;letter-spacing:.08em;border-radius:999px;padding:2px 10px}
.end{text-align:center;padding:24px 16px 8px}
.end a.pdf{font-size:16px;padding:14px 24px}
.end p{margin-top:14px;font-size:13px;color:var(--muted);font-weight:700}
</style>
</head>
<body>
<header class="bar"><div>
  <div class="name"><b>CIELIS</b><span>SNSマネタイズ事業 ご紹介資料</span></div>
  <a class="pdf" href="cielis-deck.pdf" download="CIELIS_SNSマネタイズ事業_ご紹介資料.pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDF</a>
</div></header>
<main id="slides"></main>
<div class="end">
  <a class="pdf" href="cielis-deck.pdf" download="CIELIS_SNSマネタイズ事業_ご紹介資料.pdf"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>PDFで保存する</a>
  <p>合同会社CIELIS ｜ SNSマネタイズ事業</p>
</div>
<script>
var m=document.getElementById('slides');
for(var i=1;i<=10;i++){var n=(i<10?'0':'')+i,f=document.createElement('figure');
f.innerHTML='<img src="s'+n+'.png" alt="資料 '+i+'ページ目" width="1920" height="1080"'+(i>2?' loading="lazy"':'')+'><figcaption>'+i+' / 10</figcaption>';m.appendChild(f);}
</script>
<noscript><style>#slides{display:none}</style><p style="padding:24px;text-align:center"><a href="cielis-deck.pdf">PDFを開く</a></p></noscript>
</body>
</html>
