<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<link rel="stylesheet" href="node_modules/@fontsource/shippori-mincho-b1/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/shippori-mincho-b1/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/zen-kaku-gothic-new/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/zen-kaku-gothic-new/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/zen-kaku-gothic-new/900.css">

<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#000;font-family:"Zen Kaku Gothic New",sans-serif;color:#fff}
canvas{position:absolute;left:0;top:0}
.ov{position:absolute;pointer-events:none}
.mincho{font-family:"Shippori Mincho B1",serif}
.osw{font-family:"Oswald",sans-serif}
#flash{left:0;top:0;width:1080px;height:1920px;background:#fff;opacity:0}
#dim{left:0;top:0;width:1080px;height:1920px;background:#000;opacity:0}
/* 冒頭タイトル */
#vig{left:0;top:0;width:1080px;height:1920px;background:radial-gradient(ellipse 620px 640px at 50% 47%,rgba(4,6,14,.72),rgba(4,6,14,.45) 55%,rgba(4,6,14,0) 100%)}
#ttl{left:0;width:1080px;text-align:center;top:470px}
.kick{display:flex;align-items:center;justify-content:center;gap:22px;font-family:"Oswald";font-weight:500;font-size:30px;letter-spacing:.42em;color:#f3cf9c;text-indent:.42em}
.kick i{display:block;width:120px;height:2px;background:linear-gradient(90deg,rgba(243,207,156,0),#f3cf9c)}
.kick i.r{background:linear-gradient(90deg,#f3cf9c,rgba(243,207,156,0))}
.t1{margin-top:30px;font-family:"Shippori Mincho B1";font-weight:800;font-size:80px;letter-spacing:.18em;text-indent:.18em;line-height:1;text-shadow:0 4px 18px rgba(0,0,0,.8)}
.t2{margin-top:6px;font-family:"Shippori Mincho B1";font-weight:800;font-size:178px;letter-spacing:.02em;line-height:1.08;
  background:linear-gradient(180deg,#fff8ea 0%,#ffd88a 38%,#ff8a3c 72%,#e8442a 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 6px 0 rgba(60,10,0,.55)) drop-shadow(0 0 26px rgba(255,120,40,.55))}
.t3{margin-top:2px;font-family:"Shippori Mincho B1";font-weight:800;font-size:80px;letter-spacing:.12em;text-indent:.12em;line-height:1.1;text-shadow:0 4px 18px rgba(0,0,0,.8)}
#cd{left:0;width:1080px;text-align:center;top:1000px;transform-origin:50% 0}
.cdl{font-weight:700;font-size:36px;letter-spacing:.55em;text-indent:.55em;color:#ffc2a6;text-shadow:0 2px 10px rgba(0,0,0,.9)}
.cdn{margin-top:4px;font-family:"Oswald";font-weight:600;font-size:250px;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:.01em;color:#fff;
  text-shadow:0 0 18px rgba(255,70,40,.95),0 0 60px rgba(255,40,20,.75),0 0 120px rgba(255,30,10,.45)}
.cdn small{font-family:"Zen Kaku Gothic New";font-weight:900;font-size:64px;margin-left:10px;color:#ffd6c8;text-shadow:0 0 16px rgba(255,60,30,.9)}
.bar{position:relative;margin:26px auto 0;width:640px;height:6px;border-radius:3px;background:rgba(255,255,255,.18)}
.bar b{position:absolute;left:0;top:0;height:6px;border-radius:3px;background:linear-gradient(90deg,#ffb36a,#ff4a2a);box-shadow:0 0 14px rgba(255,80,40,.9)}
.bar s{position:absolute;top:-7px;width:20px;height:20px;margin-left:-10px;border-radius:50%;background:#fff;box-shadow:0 0 18px 6px rgba(255,90,50,.95)}
/* 上部（カット2以降） */
#ttl2{left:0;width:1080px;text-align:center;top:64px;font-family:"Shippori Mincho B1";font-weight:800;font-size:50px;letter-spacing:.06em;text-shadow:0 3px 14px rgba(0,0,0,.9)}
#ttl2 span{background:linear-gradient(180deg,#ffe2a0,#ff7a36);-webkit-background-clip:text;background-clip:text;color:transparent}
#topshade{left:0;top:0;width:1080px;height:420px;background:linear-gradient(rgba(0,0,0,.62),rgba(0,0,0,0))}
#botshade{left:0;top:1100px;width:1080px;height:820px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.42) 30%,rgba(0,0,0,.62))}
/* 見出し */
#hd{left:0;width:1080px;text-align:center;top:1190px}
#hd .h{font-family:"Shippori Mincho B1";font-weight:800;font-size:86px;line-height:1.24;text-shadow:0 4px 0 rgba(0,0,0,.45),0 0 26px rgba(0,0,0,.75)}
#hd .h em{font-style:normal;background:linear-gradient(180deg,#fff6d0,#ffc040 50%,#ff7a2a);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 0 rgba(70,20,0,.75)) drop-shadow(0 0 10px rgba(0,0,0,.7))}
#hd .s{display:inline-block;margin-top:22px;font-weight:700;font-size:38px;padding:10px 26px;border-radius:10px;background:rgba(8,10,18,.72);border:1px solid rgba(255,190,130,.35);color:#ffe6d0}
#note{left:0;width:1080px;text-align:center;top:1630px;font-size:24px;font-weight:500;color:#e8ecf4;opacity:.8;text-shadow:0 0 8px #000}
#pre{left:0;top:0;opacity:0.01;font-size:10px}
</style></head>
<body>
<div id="stage">
<canvas id="c" width="1080" height="1920"></canvas>
<div id="dim" class="ov"></div>
<div id="layers"></div>

</div>
