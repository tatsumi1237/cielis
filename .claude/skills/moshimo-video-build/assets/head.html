<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<style>
html,body{margin:0;background:#000;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#0b1016;font-family:"Noto Sans CJK JP",sans-serif}
canvas{position:absolute;left:0;top:0}
.ov{position:absolute;pointer-events:none}
.serif{font-family:"Noto Serif CJK JP",serif}
em{font-style:normal;color:#8fdcff}
em.r{color:#ff6d62}
.shadow{text-shadow:0 0 12px rgba(0,0,0,.85),0 3px 3px rgba(0,0,0,.9)}
.wl{display:inline-block;font-weight:900;font-size:30px;padding:6px 16px;border-radius:8px}
.meter{width:340px;background:rgba(11,16,22,.8);border-radius:12px;padding:10px 14px;color:#fff;box-sizing:border-box;position:relative}
.meter .lb{font-size:20px;color:#b8c0cc;font-weight:700}
.meter .val{font-size:40px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums;white-space:nowrap}
.meter .val small{font-size:22px}
.meter .bar{height:14px;background:#2a2f3a;border-radius:7px;overflow:hidden;margin-top:4px}
.meter .bar i{display:block;height:100%;border-radius:7px}
.meter .why{font-size:20px;color:#ffb3ad;font-weight:700;margin-top:6px;min-height:24px}
.minus{position:absolute;right:14px;top:-34px;font-size:38px;font-weight:900;color:#ff5d52;text-shadow:0 2px 6px rgba(0,0,0,.8)}
.tag{width:1000px;color:#fff}
.tag .d{font-size:48px;font-weight:900;line-height:1.3}
.tag .p{display:inline-block;margin-top:10px;font-size:34px;font-weight:900;background:rgba(11,16,22,.82);padding:6px 16px;border-radius:10px}
.tagT{left:36px;top:770px}.tagB{left:36px;top:1490px}
.tagT .p{color:#ffe7a8}.tagB .p{color:#9fe0ff}
.big{left:0;width:1080px;text-align:center;color:#fff}
.note{left:40px;width:1000px;color:#9aa3b2;font-size:22px;line-height:1.5}
#phone{left:270px;top:520px;width:540px;height:940px;border-radius:64px;background:#101216;border:12px solid #2a2d33;box-shadow:0 30px 80px rgba(0,0,0,.6)}
#phone .scr{position:absolute;inset:14px;border-radius:50px;background:linear-gradient(#4aa3ff,#9fd0ff);overflow:hidden;color:#fff;text-align:center}
#phone.cold .scr{background:linear-gradient(#2c3e55,#8fa6bf)}
#phone .city{font-size:40px;font-weight:700;margin-top:70px}
#phone .temp{font-size:170px;font-weight:300;line-height:1.05;font-variant-numeric:tabular-nums}
#phone .icon{font-size:110px}
#phone .list{margin:20px 34px 0;background:rgba(255,255,255,.18);border-radius:22px;padding:14px 26px;text-align:left}
#phone .list div{display:flex;justify-content:space-between;font-size:32px;font-weight:700;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.2)}
#flash{left:0;top:0;width:1080px;height:1920px;background:#fff}
#dim{left:0;top:0;width:1080px;height:1920px;background:#0b1016}
.chart{left:40px;width:1000px;background:rgba(11,16,22,.9);border-radius:24px;color:#fff}
</style></head>
<body>
<div id="stage">
<canvas id="c" width="1080" height="1920"></canvas>
<div id="dim" class="ov"></div>
<div id="layers"></div>
<div id="flash" class="ov"></div>
</div>
<script src="node_modules/three/build/three.min.js"></script>
<script>
